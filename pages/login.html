<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BloggerSaaS Ultimate V5 — Enterprise Login</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #07111f,
            #0b1728,
            #06101c
        );

    color: #ffffff;
}

.login-container {
    width: min(100%, 430px);

    padding: 34px;

    border:
        1px solid
        rgba(0, 220, 255, 0.25);

    border-radius: 20px;

    background:
        rgba(10, 25, 42, 0.94);

    box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.45);
}

.brand {
    text-align: center;
    margin-bottom: 28px;
}

.brand h1 {
    margin: 0 0 8px;

    font-size: 28px;
}

.brand p {
    margin: 0;

    color: #9fb3c8;

    font-size: 14px;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;

    margin-bottom: 7px;

    font-size: 14px;

    color: #cbd8e6;
}

input {
    width: 100%;

    padding: 13px 14px;

    border:
        1px solid
        rgba(255,255,255,0.15);

    border-radius: 10px;

    background:
        rgba(255,255,255,0.06);

    color: #ffffff;

    font-size: 15px;

    outline: none;
}

input::placeholder {
    color: #8194a8;
}

input:focus {
    border-color: #00d9ff;

    box-shadow:
        0 0 0 3px
        rgba(0,217,255,0.12);
}

button {
    width: 100%;

    padding: 13px;

    border: 0;

    border-radius: 10px;

    background: #00bcd4;

    color: #001018;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;
}

button:hover {
    background: #19d9f0;
}

button:disabled {
    opacity: 0.6;

    cursor: not-allowed;
}

.google-button {
    margin-top: 12px;

    background:
        rgba(255,255,255,0.08);

    color: #ffffff;

    border:
        1px solid
        rgba(255,255,255,0.15);
}

.google-button:hover {
    background:
        rgba(255,255,255,0.14);
}

.forgot {
    display: block;

    margin:
        14px 0 20px;

    text-align: right;

    color: #55dcff;

    font-size: 13px;

    cursor: pointer;

    text-decoration: none;
}

.forgot:hover {
    text-decoration: underline;
}

.message {
    display: none;

    margin-bottom: 18px;

    padding: 11px;

    border-radius: 9px;

    font-size: 13px;

    line-height: 1.4;
}

.message.error {
    display: block;

    background:
        rgba(255, 70, 70, 0.12);

    border:
        1px solid
        rgba(255, 70, 70, 0.3);

    color: #ffb3b3;
}

.message.success {
    display: block;

    background:
        rgba(50, 220, 130, 0.12);

    border:
        1px solid
        rgba(50, 220, 130, 0.3);

    color: #a7ffd0;
}

.message.info {
    display: block;

    background:
        rgba(0, 188, 212, 0.12);

    border:
        1px solid
        rgba(0, 188, 212, 0.3);

    color: #a9f3ff;
}

.footer {
    margin-top: 25px;

    text-align: center;

    color: #71869b;

    font-size: 12px;
}

@media (max-width: 480px) {

    body {
        padding: 14px;
    }

    .login-container {
        padding: 26px 20px;
    }

    .brand h1 {
        font-size: 25px;
    }
}

</style>
</head>

<body>

<main class="login-container">

    <div class="brand">

        <h1>
            Enterprise Login
        </h1>

        <p>
            BloggerSaaS Ultimate V5
        </p>

    </div>

    <div
        id="message"
        class="message"
        role="alert"
        aria-live="polite"
    ></div>

    <form
        id="loginForm"
        novalidate
    >

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                id="email"
                name="email"
                type="email"
                autocomplete="username"
                placeholder="Enter your email"
                required
            >

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
            >

        </div>

        <button
            id="loginButton"
            type="submit"
        >
            Sign In
        </button>

        <button
            id="googleButton"
            type="button"
            class="google-button"
        >
            Continue with Google
        </button>

        <a
            href="#"
            id="forgotPassword"
            class="forgot"
        >
            Forgot password?
        </a>

    </form>

    <div class="footer">
        BloggerSaaS Ultimate V5 Enterprise
    </div>

</main>

<script type="module">

/*
============================================================
BloggerSaaS Ultimate V5
Enterprise Login
Firebase Authentication
============================================================
*/

import {
    login,
    loginWithGoogle,
    resetPassword,
    checkAuth
} from "../firebase/auth.js";


/* =========================================================
   DOM ELEMENTS
========================================================= */

const form =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const googleButton =
    document.getElementById("googleButton");

const forgotPassword =
    document.getElementById("forgotPassword");

const message =
    document.getElementById("message");


/* =========================================================
   MESSAGE HANDLER
========================================================= */

function showMessage(
    text,
    type = "error"
) {

    message.textContent = text;

    message.className =
        `message ${type}`;

}


/* =========================================================
   FIREBASE ERROR TRANSLATION
========================================================= */

function getFirebaseErrorMessage(error) {

    const code =
        error?.code || "";

    switch (code) {

        case "auth/invalid-credential":
            return "The email or password is incorrect.";

        case "auth/wrong-password":
            return "The password is incorrect.";

        case "auth/user-not-found":
            return "No Firebase account was found with this email address.";

        case "auth/invalid-email":
            return "Please enter a valid email address.";

        case "auth/missing-password":
            return "Please enter your password.";

        case "auth/too-many-requests":
            return "Too many attempts. Please wait and try again later.";

        case "auth/popup-closed-by-user":
            return "Google sign-in was cancelled.";

        case "auth/popup-blocked":
            return "The browser blocked the Google sign-in window. Please allow pop-ups for this site and try again.";

        case "auth/cancelled-popup-request":
            return "Another Google sign-in request is already in progress.";

        case "auth/operation-not-allowed":
            return "This sign-in method is not enabled in Firebase Authentication.";

        case "auth/unauthorized-domain":
            return "This website domain is not authorized in Firebase Authentication.";

        case "auth/network-request-failed":
            return "Network error. Please check your internet connection.";

        case "auth/account-exists-with-different-credential":
            return "An account already exists with this email using another sign-in method.";

        case "auth/invalid-api-key":
            return "Firebase configuration is invalid. Please check the Firebase configuration.";

        default:

            if (error instanceof Error) {
                return error.message;
            }

            return "Unable to complete authentication. Please try again.";
    }
}


/* =========================================================
   DASHBOARD REDIRECT
========================================================= */

function redirectToDashboard() {

    window.location.href =
        "./dashboard.html";

}


/* =========================================================
   CHECK EXISTING SESSION
========================================================= */

try {

    checkAuth((user) => {

        if (user) {

            redirectToDashboard();

        }

    });

} catch (error) {

    console.error(
        "Firebase session check failed:",
        error
    );

    showMessage(
        getFirebaseErrorMessage(error),
        "error"
    );

}


/* =========================================================
   EMAIL / PASSWORD LOGIN
========================================================= */

form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        if (!email) {

            showMessage(
                "Please enter your email address.",
                "error"
            );

            emailInput.focus();

            return;
        }

        if (!password) {

            showMessage(
                "Please enter your password, or use Continue with Google / Forgot password.",
                "error"
            );

            passwordInput.focus();

            return;
        }

        loginButton.disabled = true;

        googleButton.disabled = true;

        loginButton.textContent =
            "Signing in...";

        showMessage(
            "Connecting to Firebase...",
            "info"
        );

        try {

            await login(
                email,
                password
            );

            showMessage(
                "Login successful. Opening dashboard...",
                "success"
            );

            setTimeout(
                redirectToDashboard,
                500
            );

        } catch (error) {

            console.error(
                "Email login error:",
                error
            );

            showMessage(
                getFirebaseErrorMessage(error),
                "error"
            );

        } finally {

            loginButton.disabled = false;

            googleButton.disabled = false;

            loginButton.textContent =
                "Sign In";

        }

    }
);


/* =========================================================
   GOOGLE LOGIN
========================================================= */

googleButton.addEventListener(
    "click",
    async () => {

        googleButton.disabled = true;

        loginButton.disabled = true;

        googleButton.textContent =
            "Opening Google...";

        showMessage(
            "Opening Google sign-in...",
            "info"
        );

        try {

            await loginWithGoogle();

            showMessage(
                "Google login successful. Opening dashboard...",
                "success"
            );

            setTimeout(
                redirectToDashboard,
                500
            );

        } catch (error) {

            console.error(
                "Google login error:",
                error
            );

            showMessage(
                getFirebaseErrorMessage(error),
                "error"
            );

        } finally {

            googleButton.disabled = false;

            loginButton.disabled = false;

            googleButton.textContent =
                "Continue with Google";

        }

    }
);


/* =========================================================
   FORGOT PASSWORD
========================================================= */

forgotPassword.addEventListener(
    "click",
    async (event) => {

        event.preventDefault();

        const email =
            emailInput.value.trim();

        if (!email) {

            showMessage(
                "Enter your email address first.",
                "error"
            );

            emailInput.focus();

            return;
        }

        forgotPassword.style.pointerEvents =
            "none";

        showMessage(
            "Sending password reset email...",
            "info"
        );

        try {

            await resetPassword(
                email
            );

            showMessage(
                "Password reset email sent. Please check your email, including your Spam or Junk folder.",
                "success"
            );

        } catch (error) {

            console.error(
                "Password reset error:",
                error
            );

            showMessage(
                getFirebaseErrorMessage(error),
                "error"
            );

        } finally {

            forgotPassword.style.pointerEvents =
                "auto";

        }

    }
);


/* =========================================================
   STARTUP DIAGNOSTIC
========================================================= */

console.log(
    "BloggerSaaS Ultimate V5 Enterprise Login initialized."
);

</script>

</body>
  </html>
