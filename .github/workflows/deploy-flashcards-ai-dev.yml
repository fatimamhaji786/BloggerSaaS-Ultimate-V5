name: Deploy Flashcards AI Development Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flashcards-ai-dev-deploy
  cancel-in-progress: false

jobs:
  deploy-dev-only:
    if: github.ref == 'refs/heads/feature/flashcards-ai-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out development branch only
        uses: actions/checkout@v4
        with:
          ref: feature/flashcards-ai-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "Missing GEMINI_API_KEY"; exit 1; }
          test -n "$TURNSTILE_SECRET_KEY" || { echo "Missing TURNSTILE_SECRET_KEY"; exit 1; }

      - name: Install Gemini API secret on development Worker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY --config worker/wrangler.flashcards-dev.jsonc

      - name: Install Turnstile secret on development Worker
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        shell: bash
        run: |
          printf '%s' "$TURNSTILE_SECRET_KEY" | npx --yes wrangler@4 secret put TURNSTILE_SECRET_KEY --config worker/wrangler.flashcards-dev.jsonc

      - name: Deploy development Worker only
        run: npx --yes wrangler@4 deploy --config worker/wrangler.flashcards-dev.jsonc
